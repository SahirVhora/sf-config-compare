name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with ruff
        # Pin the known-good release and the classic baseline rules so a future
        # Ruff default change cannot turn pre-existing advisory rules into a
        # portfolio-wide CI outage.
        run: pip install ruff==0.15.10 && ruff check --select E4,E7,E9,F .
      - name: Run tests
        env:
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest tests/ -q
